
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>6 as Part Part Whole with Animals</title>
<style>
body{
  margin:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:100vh;
  font-family:Arial, Helvetica, sans-serif;
  background:#ffffff;
}
.slide{
  width:1800px;
  height:1000px;
  position:relative;
  border:1px solid #ccc;
  overflow:hidden;
}
.animal{
  position:absolute;
  transform:translate(-50%,-50%);
  font-size:96px;
  filter:drop-shadow(8px 10px 8px rgba(0,0,0,0.28));
  transition:
    left 1.5s ease-in-out,
    top 1.5s ease-in-out,
    opacity 0.45s ease-in-out,
    transform 0.45s ease-in-out;
  opacity:1;
}
.animal.fade{
  opacity:0;
  transform:translate(-50%,-50%) scale(0.9);
}
button{
  margin:10px;
  padding:10px 20px;
  font-size:16px;
}
</style>
</head>
<body>

<div class="slide" id="slide"></div>
<div>
  <button onclick="start()">Start</button>
  <button onclick="pause()">Pause</button>
</div>

<script>
const slide = document.getElementById("slide");
const cx = 900;
const cy = 500;

let timer = null;
let running = false;
let stepIndex = 0;

const animals = ["😺","🐶","🐰","🐢","🐟","🐦"];

const items = [];
for(let k = 0; k < 6; k++){
  const d = document.createElement("div");
  d.className = "animal";
  slide.appendChild(d);
  items.push(d);
}

function randomBackground(){
  const colors = ["#ffffff","#f2f2f2","#e8f0fe","#fff3cd","#e6ffe6","#fce4ec","#e0f7fa"];
  slide.style.background = colors[Math.floor(Math.random() * colors.length)];
}

function shuffle(a){
  const copy = [...a];
  for(let i = copy.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function randomTwoAnimals(){
  return shuffle(animals).slice(0,2);
}

function randomPartPair(){
  const a = Math.floor(Math.random() * 5) + 1;
  return [a, 6 - a];
}

function randomStart(){
  const chosen = randomTwoAnimals();
  const parts = randomPartPair();

  const pts = [];
  let attempts = 0;

  while(pts.length < 6 && attempts < 7000){
    attempts++;
    const x = 200 + Math.random() * 1400;
    const y = 200 + Math.random() * 600;
    let ok = true;

    for(const p of pts){
      const dx = p.x - x;
      const dy = p.y - y;
      if(Math.sqrt(dx * dx + dy * dy) < 110){
        ok = false;
        break;
      }
    }

    if(ok){
      const animal = pts.length < parts[0] ? chosen[0] : chosen[1];
      pts.push({x, y, animal});
    }
  }

  return pts;
}

function partWholeLine(size){
  const chosen = randomTwoAnimals();
  const parts = randomPartPair();

  const spacing = size * 0.7;
  const gapBetweenParts = size * 1.4;
  const totalWidth =
    6 * size +
    4 * spacing +
    gapBetweenParts;

  let x = (1800 - totalWidth) / 2 + size / 2;
  const pts = [];

  for(let i = 0; i < parts[0]; i++){
    pts.push({x, y:cy, animal:chosen[0]});
    x += size + spacing;
  }

  x += gapBetweenParts - spacing;

  for(let i = 0; i < parts[1]; i++){
    pts.push({x, y:cy, animal:chosen[1]});
    x += size + spacing;
  }

  return pts;
}

function apply(p){
  p.forEach((d,k)=>{
    const el = items[k];
    el.classList.add("fade");

    setTimeout(()=>{
      el.style.left = d.x + "px";
      el.style.top = d.y + "px";
      el.innerText = d.animal;
      el.classList.remove("fade");
    }, 200);
  });
}

const sequence = [];
for(let r = 0; r < 4; r++){
  sequence.push(() => randomStart());
  sequence.push(() => partWholeLine(80));
}

function loop(){
  if(!running) return;
  randomBackground();
  apply(sequence[stepIndex]());
  stepIndex = (stepIndex + 1) % sequence.length;
  timer = setTimeout(loop, 2600);
}

function start(){
  if(running) return;
  running = true;
  loop();
}

function pause(){
  running = false;
  clearTimeout(timer);
}
</script>

</body>
</html>
